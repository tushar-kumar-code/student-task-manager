<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header">
                    <h3 class="mb-0">✏ Edit Task</h3>
                </div>

                <div class="card-body">

                    <form action="{{ url_for('update_task', task_id=task[0]) }}" method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Task
                            </label>

                            <input
                                type="text"
                                name="task"
                                class="form-control"
                                value="{{ task[1] }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                name="priority"
                                class="form-select">

                                <option value="High"
                                    {% if task[2] == "High" %}selected{% endif %}>
                                    High 🔴
                                </option>

                                <option value="Medium"
                                    {% if task[2] == "Medium" %}selected{% endif %}>
                                    Medium 🟡
                                </option>

                                <option value="Low"
                                    {% if task[2] == "Low" %}selected{% endif %}>
                                    Low 🟢
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Due Date
                            </label>

                            <input
                                type="date"
                                name="due_date"
                                class="form-control"
                                value="{{ task[3] if task[3] else '' }}">

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-primary">

                                Update Task

                            </button>

                            <a
                                href="{{ url_for('dashboard') }}"
                                class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
