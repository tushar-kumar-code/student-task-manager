<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-box">

        <h1>Edit Task</h1>

        <form action="/update-task/{{ task[0] }}" method="POST">

            <input
                type="text"
                name="task"
                value="{{ task[1] }}"
                required>

            <button type="submit">
                Update Task
            </button>

        </form>

        <br>

        <a href="/dashboard">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
